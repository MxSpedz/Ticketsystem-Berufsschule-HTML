<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<style>
body {
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#f3f4f6;
    font-family:Segoe UI, sans-serif;
}
.login-box {
    background:white;
    padding:2rem;
    border-radius:10px;
    box-shadow:0 3px 10px rgba(0,0,0,0.2);
    width:300px;
    text-align:center;
}
.login-box input {
    width:100%;
    padding:0.6rem;
    margin-top:1rem;
    border-radius:6px;
    border:1px solid #ccc;
}
.login-btn {
    margin-top:1.2rem;
    padding:0.7rem;
    width:100%;
    background:#1f2937;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
}
</style>

</head>
<body>

<div class="login-box">
    <h2>Login</h2>

    <form action="/login" method="post">

        <input name="username" placeholder="Benutzername">

        <input type="password" name="password" placeholder="Passwort">

        <button class="login-btn" type="submit">Login</button>

    </form>

</div>

</body>
</html>
